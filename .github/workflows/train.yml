name: Train Turp

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Train checkpoint
        run: node train.js --steps 2000 --batch 32 --lr 0.0025

      - name: Commit checkpoint
        run: |
          git config user.name "turp-trainer"
          git config user.email "turp-trainer@users.noreply.github.com"
          git add turp-v1.gguf
          if git diff --cached --quiet; then
            echo "no checkpoint change"
          else
            git commit -m "train: checkpoint $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Publish GGUF release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view turp-v1 >/dev/null 2>&1 || gh release create turp-v1 \
            --title "Turp v1 (GGUF)" \
            --notes "Turp's own weights, trained from scratch on GitHub Actions CPU. GGUF v3 container with the custom 'turp' word-level architecture."
          gh release upload turp-v1 turp-v1.gguf --clobber

      - name: Milestone snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STEPS=$(node -e "const fs=require('fs');const g=require('./gguf.js');console.log(g.parse(fs.readFileSync('turp-v1.gguf')).meta.steps)" 2>/dev/null || echo 0)
          echo "steps=$STEPS"
          if [ "$STEPS" -gt 0 ] && [ $((STEPS % 100000)) -eq 0 ]; then
            gh release view "turp-${STEPS}" >/dev/null 2>&1 || \
              gh release create "turp-${STEPS}" turp-v1.gguf \
                --title "Turp — ${STEPS} steps" \
                --notes "Checkpoint after ${STEPS} training steps, trained from scratch on GitHub Actions CPU."
            echo "milestone release turp-${STEPS} ready"
          fi
