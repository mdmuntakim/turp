name: Train Turp

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps for this run"
        default: "100000"
      repeat_chat:
        description: "How many times to repeat chat.txt"
        default: "500"
      repeat_code:
        description: "How many times to repeat code.txt"
        default: "300"
      story_chars:
        description: "Limit story corpus size (0 = full)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Corpus
        run: |
          mkdir -p data
          if [ ! -f data/tinystories.txt ]; then
            curl -fsSL --max-time 600 -o data/tinystories.txt \
              https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStories-valid.txt
          fi
          wc -c data/tinystories.txt

      - name: Checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download turp-v1 -p turp-ckpt.zip -O work/ckpt.zip 2>/dev/null || true
          if [ -f work/ckpt.zip ]; then
            mkdir -p work/model
            unzip -q -o work/ckpt.zip -d work/model
            echo "resuming from checkpoint:"
            ls work/model
          fi

      - name: Train
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS: ${{ inputs.steps || '100000' }}
          REPEAT_CHAT: ${{ inputs.repeat_chat || '500' }}
          REPEAT_CODE: ${{ inputs.repeat_code || '300' }}
          STORY_CHARS: ${{ inputs.story_chars || '0' }}
        run: |
          gh release view turp-v1 >/dev/null 2>&1 || gh release create turp-v1 \
            --title "Turp (GGUF)" \
            --notes "Turp is a GPT-2-architecture transformer trained from scratch on GitHub Actions CPU. The .gguf is produced by llama.cpp's own converter and runs in the browser with a JavaScript GGUF engine."
          (
            while true; do
              sleep 300
              if [ -f work/turp-ckpt.zip ] && unzip -tq work/turp-ckpt.zip >/dev/null 2>&1; then
                gh release upload turp-v1 work/turp-ckpt.zip --clobber >/dev/null 2>&1 \
                  && echo "mid-run checkpoint uploaded $(date -u +%H:%M:%S)"
              fi
            done
          ) &
          UPLOADER=$!
          python train.py \
            --data data/tinystories.txt \
            --model work/model \
            --steps "$STEPS" --batch 8 --seq 128 --milestone 100000 \
            --repeat-chat "$REPEAT_CHAT" --repeat-code "$REPEAT_CODE" \
            --story-chars "$STORY_CHARS"
          STATUS=$?
          kill $UPLOADER 2>/dev/null || true
          exit $STATUS

      # Save training progress FIRST. Conversion can fail without losing steps.
      - name: Save checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f work/turp-ckpt.zip ]; then
            echo "no checkpoint produced"
            exit 0
          fi
          gh release view turp-v1 >/dev/null 2>&1 || gh release create turp-v1 \
            --title "Turp (GGUF)" \
            --notes "Turp is a GPT-2-architecture transformer trained from scratch on GitHub Actions CPU. The .gguf is produced by llama.cpp's own converter and runs in the browser with a JavaScript GGUF engine."
          gh release upload turp-v1 work/turp-ckpt.zip --clobber
          git config user.name "turp-trainer"
          git config user.email "turp-trainer@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "status unchanged"
          else
            git commit -m "train: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turp-checkpoint
          path: work/turp-ckpt.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Convert to GGUF
        if: always()
        run: |
          if [ ! -f work/model/config.json ]; then
            echo "no model to convert"
            exit 0
          fi
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          python convert_gguf.py
          ls -la turp-v1.gguf

      - name: Commit GGUF
        if: always()
        run: |
          if [ ! -f turp-v1.gguf ]; then
            echo "no GGUF produced"
            exit 0
          fi
          git config user.name "turp-trainer"
          git config user.email "turp-trainer@users.noreply.github.com"
          git add turp-v1.gguf status.json
          if git diff --cached --quiet; then
            echo "no model change"
          else
            git commit -m "model: GGUF checkpoint $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view turp-v1 >/dev/null 2>&1 || gh release create turp-v1 \
            --title "Turp (GGUF)" \
            --notes "Turp is a GPT-2-architecture transformer trained from scratch on GitHub Actions CPU. The .gguf is produced by llama.cpp's own converter and runs in the browser with a JavaScript GGUF engine."
          if [ -f turp-v1.gguf ]; then
            gh release upload turp-v1 turp-v1.gguf work/turp-ckpt.zip --clobber
          fi

      - name: Milestone snapshot
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STEPS=$(python -c "import json;print(json.load(open('status.json'))['steps'])" 2>/dev/null || echo 0)
          echo "steps=$STEPS"
          if [ "$STEPS" -gt 0 ] && [ $((STEPS % 100000)) -eq 0 ] && [ -f turp-v1.gguf ]; then
            gh release view "turp-${STEPS}" >/dev/null 2>&1 || \
              gh release create "turp-${STEPS}" turp-v1.gguf \
                --title "Turp — ${STEPS} steps" \
                --notes "Checkpoint after ${STEPS} training steps, trained from scratch on GitHub Actions CPU."
            echo "milestone release turp-${STEPS} ready"
          fi
