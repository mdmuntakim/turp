<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turp</title>
<style>
body{font-family:monospace;max-width:720px;margin:24px auto;padding:0 14px;line-height:1.5}
#stats{color:#555;margin:6px 0 14px}
#messages{min-height:40vh}
#messages div{margin:10px 0;white-space:pre-wrap}
#messages b{display:inline}
#row{display:flex;gap:6px;margin-top:14px}
#input{flex:1;font:inherit;padding:4px}
</style>
</head>
<body>
<div><b>Turp</b> — <span id="status">loading model…</span></div>
<div id="stats">params — · steps — · loss —</div>
<div id="messages"></div>
<div id="row">
  <input id="input" placeholder="Message Turp…" disabled>
  <button id="send" disabled>Send</button>
</div>
<script src="model.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var model = null, history = [], busy = false;

  function line(who, text) {
    var d = document.createElement("div");
    var b = document.createElement("b");
    b.textContent = who + ": ";
    d.appendChild(b);
    d.appendChild(document.createTextNode(text));
    $("messages").appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
    return d;
  }

  function promptFor(msg) {
    var recent = history.slice(-6).map(function (m) {
      return (m.role === "user" ? "User: " : "Turp: ") + m.content;
    }).join("\n");
    return (recent ? recent + "\n" : "") + "User: " + msg + "\nTurp:";
  }

  function send() {
    var input = $("input");
    var text = input.value.trim();
    if (!model || busy || !text) return;
    input.value = "";
    line("You", text);
    history.push({ role: "user", content: text });
    var el = line("Turp", "…");
    busy = true;
    $("send").disabled = true;

    setTimeout(function () {
      try {
        var out = TurpModel.generate(model, promptFor(text), { maxLen: 320, temperature: 0.75, topK: 18 });
        var cut = out.indexOf("\nUser:");
        if (cut >= 0) out = out.slice(0, cut);
        out = out.trim() || "I have not learned enough to answer that yet.";
        el.lastChild.textContent = out;
        history.push({ role: "assistant", content: out });
        if (history.length > 12) history = history.slice(-12);
      } catch (e) {
        el.lastChild.textContent = "error: " + e.message;
      }
      busy = false;
      $("send").disabled = false;
    }, 20);
  }

  fetch("model.json?t=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (json) {
      model = TurpModel.fromJSON(json);
      var m = model.meta;
      $("stats").textContent = "params " + Number(m.params).toLocaleString("en-US") +
        " · steps " + Number(m.steps).toLocaleString("en-US") +
        " · loss " + Number(m.loss).toFixed(3) +
        " · checkpoint " + m.updated;
      $("status").textContent = "model loaded (trained from scratch on GitHub Actions)";
      $("input").disabled = false;
      $("send").disabled = false;
      $("input").focus();
    })
    .catch(function (e) {
      $("status").textContent = "model not available yet";
      line("Turp", "No trained model found (" + e.message + "). Run the Train Turp workflow in GitHub Actions.");
    });

  $("send").onclick = send;
  $("input").onkeydown = function (e) {
    if (e.key === "Enter") { e.preventDefault(); send(); }
  };
})();
</script>
</body>
</html>
